name: MethodenAnalyser smoke tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.runner }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            python-version: "3.10"
          - runner: windows-2025-vs2026
            python-version: "3.11"
          - runner: windows-2025-vs2026
            python-version: "3.12"
          - runner: windows-2025-vs2026
            python-version: "3.13"
          - runner: ubuntu-latest
            python-version: "3.11"
          - runner: ubuntu-latest
            python-version: "3.13"
          - runner: macos-26
            python-version: "3.11"
          - runner: macos-26
            python-version: "3.13"

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Compile Python files
        run: python -m py_compile MethodenAnalyser3.py manage_translations.py translator.py webapp/server.py

      - name: Import analyzer module and Tk runtime
        run: python -c "import tkinter as tk; import MethodenAnalyser3 as m; print(f'Tk {tk.TkVersion} / threshold {m.SIMILARITY_THRESHOLD}')"

      - name: Run test suite via pytest
        run: pytest -v
