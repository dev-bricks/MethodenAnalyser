<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    
    <!-- Rainbow Gradient -->
    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="20%" stop-color="#ff9f0a"/>
      <stop offset="40%" stop-color="#ffd60a"/>
      <stop offset="60%" stop-color="#30d158"/>
      <stop offset="80%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>

    <!-- Rainbow Radial Glow (for ambient light behind the art) -->
    <radialGradient id="rainbow-glow" cx="25%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Stylesheet for typography -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .sub-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      fill: #818cf8;
      letter-spacing: 3px;
      opacity: 0.9;
    }
    .title {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: #ffffff;
      letter-spacing: -1.5px;
    }
    .tagline {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: -0.2px;
    }
    .features {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 11px;
      fill: #4b5563;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg-glow)" rx="16"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="16"/>
  
  <!-- Ambient Rainbow Light -->
  <ellipse cx="300" cy="170" rx="220" ry="140" fill="url(#rainbow-glow)"/>

  <!-- Card Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ==================== LEFT GRAPHIC: RAINBOW & AST ==================== -->
  
  <!-- Code Brackets Framing the Art -->
  <path d="M 130,90 C 105,90 105,155 95,170 C 105,185 105,250 130,250" fill="none" stroke="#374151" stroke-width="2" opacity="0.6"/>
  <path d="M 470,90 C 495,90 495,155 505,170 C 495,185 495,250 470,250" fill="none" stroke="#374151" stroke-width="2" opacity="0.6"/>

  <!-- Ambient Glow behind the Rainbow Waves -->
  <g opacity="0.3" filter="url(#glow-filter)">
    <path d="M 110,145 C 180,75 260,255 340,165 C 400,95 440,95 490,145" fill="none" stroke="#ff453a" stroke-width="6" stroke-linecap="round"/>
    <path d="M 110,151 C 180,81 260,261 340,171 C 400,101 440,101 490,151" fill="none" stroke="#ff9f0a" stroke-width="6" stroke-linecap="round"/>
    <path d="M 110,157 C 180,87 260,267 340,177 C 400,107 440,107 490,157" fill="none" stroke="#ffd60a" stroke-width="6" stroke-linecap="round"/>
    <path d="M 110,163 C 180,93 260,273 340,183 C 400,113 440,113 490,163" fill="none" stroke="#30d158" stroke-width="6" stroke-linecap="round"/>
    <path d="M 110,169 C 180,99 260,279 340,189 C 400,119 440,119 490,169" fill="none" stroke="#0a84ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 110,175 C 180,105 260,285 340,195 C 400,125 440,125 490,175" fill="none" stroke="#bf5af2" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Sharp Foreground Rainbow Waves -->
  <g stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 110,145 C 180,75 260,255 340,165 C 400,95 440,95 490,145" stroke="#ff453a"/>
    <path d="M 110,151 C 180,81 260,261 340,171 C 400,101 440,101 490,151" stroke="#ff9f0a"/>
    <path d="M 110,157 C 180,87 260,267 340,177 C 400,107 440,107 490,157" stroke="#ffd60a"/>
    <path d="M 110,163 C 180,93 260,273 340,183 C 400,113 440,113 490,163" stroke="#30d158"/>
    <path d="M 110,169 C 180,99 260,279 340,189 C 400,119 440,119 490,169" stroke="#0a84ff"/>
    <path d="M 110,175 C 180,105 260,285 340,195 C 400,125 440,125 490,175" stroke="#bf5af2"/>
  </g>

  <!-- AST Connection Lines -->
  <g stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8">
    <line x1="300" y1="100" x2="240" y2="160" />
    <line x1="300" y1="100" x2="360" y2="160" />
    <line x1="240" y1="160" x2="200" y2="220" />
    <line x1="240" y1="160" x2="280" y2="220" />
    <line x1="360" y1="160" x2="320" y2="220" />
    <line x1="360" y1="160" x2="400" y2="220" />
  </g>

  <!-- AST Nodes (with glow and white core) -->
  <!-- Root -->
  <circle cx="300" cy="100" r="7.5" fill="#ffd60a" filter="url(#glow-filter)" />
  <circle cx="300" cy="100" r="2.5" fill="#ffffff" />

  <!-- Children -->
  <circle cx="240" cy="160" r="6" fill="#30d158" filter="url(#glow-filter)" />
  <circle cx="240" cy="160" r="2" fill="#ffffff" />

  <circle cx="360" cy="160" r="6" fill="#0a84ff" filter="url(#glow-filter)" />
  <circle cx="360" cy="160" r="2" fill="#ffffff" />

  <!-- Grandchildren -->
  <circle cx="200" cy="220" r="5" fill="#ff453a" filter="url(#glow-filter)" />
  <circle cx="200" cy="220" r="1.5" fill="#ffffff" />

  <circle cx="280" cy="220" r="5" fill="#ff9f0a" filter="url(#glow-filter)" />
  <circle cx="280" cy="220" r="1.5" fill="#ffffff" />

  <circle cx="320" cy="220" r="5" fill="#bf5af2" filter="url(#glow-filter)" />
  <circle cx="320" cy="220" r="1.5" fill="#ffffff" />

  <circle cx="400" cy="220" r="5" fill="#ff375f" filter="url(#glow-filter)" />
  <circle cx="400" cy="220" r="1.5" fill="#ffffff" />

  <!-- ==================== RIGHT COLUMN: TEXT ==================== -->
  
  <!-- Tech-Sub-Tagline -->
  <text x="545" y="110" class="sub-title">// STATIC CODE ANALYSIS</text>

  <!-- Wordmark "MethodenAnalyser" -->
  <text x="545" y="170" class="title">
    <tspan fill="#ffffff">Methoden</tspan><tspan fill="url(#rainbow-grad)">Analyser</tspan>
  </text>

  <!-- Tagline -->
  <text x="545" y="210" class="tagline">Static Python analysis across a spectrum of methods</text>

  <!-- Features Footer -->
  <text x="545" y="255" class="features">UNUSED IMPORTS  •  DEAD DEFINITIONS  •  SIMILARITY SCAN</text>

</svg>
